# The end-to-end tests' cluster (make e2e-cluster). One node; Prometheus's NodePort (test/e2e/config/prometheus.yaml)
# is published on the host's 127.0.0.1:9090, where the tests query it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090
        hostPort: 9090
        listenAddress: 127.0.0.1
