# A Prometheus for the end-to-end tests, in its own namespace. It discovers pods through the API server and scrapes
# every container port named "metrics" every 2 seconds: the demo app's pods and the operator's. Pod labels the
# operator sets (rollouts.vivekdavara.github.io/rollout, /track, /revision) become the labels rollout, track and
# revision, so a query can select track="canary" (DESIGN.md, "The objects the operator writes"); the namespace and
# the pod's app label are kept too. Its API is published on the node's port 30090, which test/e2e/kind.yaml maps
# to the host's 127.0.0.1:9090.
apiVersion: v1
kind: Namespace
metadata:
  name: canary-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: canary-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canary-e2e-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canary-e2e-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canary-e2e-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: canary-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: canary-e2e
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 2s
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - action: labelmap
            regex: __meta_kubernetes_pod_label_rollouts_vivekdavara_github_io_(.+)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: canary-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: canary-e2e
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
      nodePort: 30090
