{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) }}
{{- fail "replicaCount above 1 needs leaderElection.enabled: without it every replica reconciles, and they overwrite each other's decisions" }}
{{- end }}
{{- if eq (int .Values.metricsPort) (int .Values.probesPort) }}
{{- fail "metricsPort and probesPort must differ: the operator serves each on its own port" }}
{{- end }}
{{- range $key, $_ := .Values.podLabels }}
{{- if hasKey (include "canary.labels" $ | fromYaml) $key }}
{{- fail (printf "podLabels can't set %s: the chart sets it (the Deployment's selector, or Helm's own labels)" $key) }}
{{- end }}
{{- end }}
# The operator: the same container as config/manager/manager.yaml (non-root, read-only root filesystem, no
# capabilities, both probes), with the Prometheus address and the query timeout from the values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "canary.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "canary.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Written out either way, so a helm upgrade can switch between them: Helm 4 applies server-side, and a rollingUpdate
  # the API server defaulted would stay and be refused next to Recreate; one the chart applied is removed with it.
  strategy:
  {{- if .Values.leaderElection.enabled }}
    # One new pod at a time and never one fewer ready: the new pod waits for the Lease, which the old one gives up
    # as it stops.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
    # Without leader election nothing stops two operators reconciling at once, and a rolling update runs the new pod
    # beside the old one: the old one stops first instead.
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "canary.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "canary.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "canary.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        {{- $name := "" }}
        {{- if kindIs "map" . }}{{ $name = .name }}{{ else if not (kindIs "invalid" .) }}{{ $name = toString . }}{{ end }}
        {{- if not $name }}{{ fail "imagePullSecrets: each item is a Secret's name, or {name: ...}" }}{{ end }}
        - name: {{ $name | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Quoted: a value can end in ":" (a URL's path may), which YAML would read as a mapping.
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - {{ printf "--metrics-bind-address=:%v" .Values.metricsPort | quote }}
            - {{ printf "--health-probe-bind-address=:%v" .Values.probesPort | quote }}
            {{- with .Values.prometheus.url }}
            - {{ printf "--prometheus-url=%s" . | quote }}
            {{- end }}
            - {{ printf "--analysis-timeout=%s" .Values.analysisTimeout | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
            - name: probes
              containerPort: {{ .Values.probesPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
