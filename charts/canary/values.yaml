# The operator's image. There is no published image: make images builds canary:dev (load it into kind with
# kind load docker-image canary:dev), or push it to a registry of your own and set repository and tag here.
image:
  repository: canary
  tag: dev
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Two replicas with leader election: one reconciles, the other takes the Lease within its 15 seconds if the first
# goes. More than one replica needs leader election (the chart refuses otherwise: two operators would both write).
replicaCount: 2
leaderElection:
  enabled: true

# The Prometheus the analysis queries, e.g. http://prometheus.monitoring.svc:9090. Without it every check fails
# closed, so a rollout with analysis rolls back (its AnalysisPassing condition says why).
prometheus:
  url: ""
# How long one analysis query may take (a Go duration).
analysisTimeout: 10s

# The operator's own ports: Prometheus metrics (a container port named "metrics") and /healthz and /readyz.
metricsPort: 8111
probesPort: 8121

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
