# The operator as a Helm chart (Helm 3.8+ or 4): helm install canary charts/canary -n canary-system --create-namespace.
# crds/ and files/role.yaml are copies of the generated files (make manifests writes them), so the chart can't drift
# from the types and the reconciler's rbac markers; CI fails if a copy wasn't committed.
apiVersion: v2
name: canary
description: A Kubernetes operator for canary rollouts, checked against Prometheus metrics.
type: application
version: 1.0.0
appVersion: 1.0.0
home: https://github.com/vivekdavara/canary
sources:
  - https://github.com/vivekdavara/canary
keywords:
  - canary
  - rollout
  - operator
  - prometheus
